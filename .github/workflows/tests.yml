name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install
        run: pip install -r requirements.txt
      - name: tests
        run: PYTHONPATH=src python -m pytest -q

  own-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: scan our own requirements for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
          pip-audit -r requirements-train.txt
