[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-triage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scikit-learn",
    "joblib",
    "fastapi",
    "uvicorn",
]

[tool.setuptools.package-data]
triage = ["web/*.html", "web/static/*", "web/static/fonts/*"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
